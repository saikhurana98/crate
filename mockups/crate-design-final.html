document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ured<\u002Fspan><\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ it.locked }}\" hint-placeholder-val=\"{{ false }}\">\n                          <svg title=\"Pinned final fallback — locked\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5d6456\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ it.gear }}\" hint-placeholder-val=\"{{ true }}\">\n                          <button data-source=\"{{ it.name }}\" onclick=\"{{ openPanel }}\" title=\"Configure\" style=\"background:none;border:none;cursor:pointer;color:#5d6456;padding:3px;border-radius:8px;display:inline-flex;transition:color .15s,background .15s\" style-hover=\"color:#e9ede3;background:#22261f\">\n                            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"transition:transform .45s cubic-bezier(.3,.8,.3,1)\" style-hover=\"transform:rotate(90deg)\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2\"><\u002Fpath><\u002Fsvg>\n                          <\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ t.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:relative;z-index:1;background:{{ t.bg }};padding:8px 10px;font:400 11px 'JetBrains Mono';color:#464d40\">Drop sources here<\u002Fdiv>\n                <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- fall-through label on the rail -->\n            <sc-if value=\"{{ t.showFall }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;align-items:center;gap:11px;margin-top:12px;position:relative\">\n                <span style=\"width:27px;display:flex;justify-content:center;flex-shrink:0\"><span style=\"color:#464d40;font-size:9px;line-height:1;background:#111411;padding:3px 0\">▼<\u002Fspan><\u002Fspan>\n                <span style=\"font:500 9.5px 'JetBrains Mono';letter-spacing:.05em;color:#5d6456\">no verified file · falls through<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- library node -->\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px;position:relative\">\n          <span style=\"width:27px;display:flex;justify-content:center;flex-shrink:0\"><span style=\"width:19px;height:19px;border-radius:50%;background:#dfe4d6;display:inline-flex;align-items:center;justify-content:center;font:700 10px 'JetBrains Mono';color:#14170f;border:4px solid #111411;box-sizing:content-box\">✓<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;background:#dfe4d6;font:600 11px 'JetBrains Mono';letter-spacing:.05em;color:#14170f\">verified file → library<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- disabled tray -->\n        <div data-tier=\"disabled\" ondragover=\"{{ onColDragOver }}\" ondrop=\"{{ onColDrop }}\" style=\"margin-top:18px;border:1px dashed {{ trayBorder }};border-radius:18px;background:{{ trayBg }};padding:12px 16px;transition:border-color .15s\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:9px\">\n            <span style=\"font:600 12px 'Instrument Sans';color:#99a091\">Available / Disabled<\u002Fspan>\n            <span style=\"font:500 10.5px 'JetBrains Mono';color:#5d6456\">{{ trayCount }}<\u002Fspan>\n            <span style=\"margin-left:auto;font:400 10px 'JetBrains Mono';color:#464d40\">not in the cascade<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;min-height:56px\">\n            <sc-for list=\"{{ trayItems }}\" as=\"it\" hint-placeholder-count=\"1\">\n              <sc-if value=\"{{ it.isPlaceholder }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:0 0 130px;border:1px dashed #99a091;border-radius:14px;background:rgba(233,237,227,.04)\"><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ it.isCard }}\" hint-placeholder-val=\"{{ true }}\">\n                <div draggable=\"{{ it.draggable }}\" data-source=\"{{ it.name }}\" data-tier=\"disabled\" data-index=\"{{ it.index }}\" ondragstart=\"{{ onCardDragStart }}\" ondragend=\"{{ onCardDragEnd }}\" ondragover=\"{{ onCardDragOver }}\" style=\"flex:0 1 240px;min-width:168px;display:flex;align-items:center;gap:9px;background:#181c17;border:1px solid {{ it.cardBorder }};border-radius:14px;padding:11px 12px;cursor:{{ it.cursor }};opacity:{{ it.opacity }};transition:border-color .15s;{{ it.shakeStyle }}\" style-hover=\"border-color:#39402f\">\n                  <span style=\"color:{{ it.handleColor }};font:600 12px 'JetBrains Mono';letter-spacing:-2px;cursor:{{ it.handleCursor }};user-select:none\">{{ it.handle }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:7px\">\n                      <span style=\"font:600 13px 'JetBrains Mono';color:#e9ede3\">{{ it.name }}<\u002Fspan>\n                      <span style=\"font:600 8.5px 'JetBrains Mono';letter-spacing:.1em;padding:2px 7px;border-radius:10px;background:{{ it.badgeBg }};color:{{ it.badgeColor }};border:1px solid {{ it.badgeBorder }}\">{{ it.qualityBadge }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:6px;margin-top:5px\">\n                      <span style=\"width:5px;height:5px;border-radius:50%;background:{{ it.credColor }};flex-shrink:0\"><\u002Fspan>\n                      <span style=\"font:500 10px 'JetBrains Mono';color:{{ it.credColor }}\">{{ it.credText }}<\u002Fspan>\n                      <sc-if value=\"{{ it.warn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:400 10px 'JetBrains Mono';color:#ff4c38\">· unconfigured<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <button data-source=\"{{ it.name }}\" onclick=\"{{ openPanel }}\" title=\"Configure\" style=\"background:none;border:none;cursor:pointer;color:#5d6456;padding:3px;border-radius:8px;display:inline-flex;transition:color .15s,background .15s\" style-hover=\"color:#e9ede3;background:#22261f\">\n                    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"transition:transform .45s cubic-bezier(.3,.8,.3,1)\" style-hover=\"transform:rotate(90deg)\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ trayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"align-self:center;font:400 11px 'JetBrains Mono';color:#464d40;padding:12px 4px\">Every source is in a tier<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ============ RIGHT RAIL ============ -->\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n\n        <!-- spotify listening -->\n        <div style=\"background:#111411;border:1px solid #22261f;border-radius:18px;padding:15px 17px\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px\">\n            <span style=\"font:600 13px 'Instrument Sans'\">Listening<\u002Fspan>\n            <span style=\"font:400 10.5px 'JetBrains Mono';color:#5d6456\">spotify · connected<\u002Fspan>\n            <span style=\"margin-left:auto;font:400 10px 'JetBrains Mono';color:#464d40\">grab what you're playing<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- now playing -->\n          <div style=\"display:flex;align-items:center;gap:12px;background:#181c17;border:1px solid #272c25;border-radius:14px;padding:11px 12px\">\n            <span style=\"width:40px;height:40px;border-radius:10px;background:#0c0e0c;border:1px solid #272c25;display:flex;align-items:flex-end;justify-content:center;gap:2.5px;padding-bottom:10px;flex-shrink:0\">\n              <span style=\"width:2.5px;background:#e9ede3;border-radius:2px;animation:eq1 .9s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"width:2.5px;background:#e9ede3;border-radius:2px;animation:eq2 1.1s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"width:2.5px;background:#e9ede3;border-radius:2px;animation:eq3 .8s ease-in-out infinite\"><\u002Fspan>\n            <\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font:600 13px 'Instrument Sans';color:#e9ede3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ npTitle }}<\u002Fdiv>\n              <div style=\"font:400 11px 'Instrument Sans';color:#99a091;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ npArtist }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;margin-top:6px\">\n                <div style=\"flex:1;height:3px;background:#272c25;border-radius:3px;overflow:hidden\"><div style=\"height:100%;width:{{ npProgress }};background:#e9ede3;border-radius:3px;transition:width 1s linear\"><\u002Fdiv><\u002Fdiv>\n                <span style=\"font:700 11px 'Doto';color:#99a091;flex-shrink:0\">{{ npTime }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ npQueued }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font:600 10px 'JetBrains Mono';color:#e9ede3;padding:5px 10px;border-radius:14px;background:rgba(233,237,227,.09);flex-shrink:0\">✓ queued<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ npCanQueue }}\" hint-placeholder-val=\"{{ true }}\">\n              <button data-id=\"{{ npId }}\" onclick=\"{{ queueTrack }}\" title=\"Download this track\" style=\"width:30px;height:30px;border-radius:50%;border:1px solid #272c25;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#99a091;flex-shrink:0;transition:border-color .15s,color .15s\" style-hover=\"border-color:#e9ede3;color:#e9ede3\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4v11M6 10l6 6 6-6M5 20h14\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- recently played -->\n          <div style=\"font:600 9px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#464d40;margin:12px 2px 4px\">Recently played<\u002Fdiv>\n          <sc-for list=\"{{ recentPlays }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #1a1e19\">\n              <span style=\"width:30px;height:30px;border-radius:8px;background:#181c17;border:1px solid #272c25;display:flex;align-items:center;justify-content:center;font:800 12px 'Doto';color:#5d6456;flex-shrink:0\">{{ p.letter }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:500 12px 'Instrument Sans';color:#e9ede3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.title }}<\u002Fdiv>\n                <div style=\"font:400 10px 'Instrument Sans';color:#5d6456;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.artist }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:400 9.5px 'JetBrains Mono';color:#464d40;flex-shrink:0\">{{ p.when }}<\u002Fspan>\n              <sc-if value=\"{{ p.inLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n                <span title=\"Already in library\" style=\"font:500 9.5px 'JetBrains Mono';color:#5d6456;padding:4px 9px;border-radius:12px;border:1px solid #272c25;flex-shrink:0\">in library<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.queued }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font:600 9.5px 'JetBrains Mono';color:#e9ede3;padding:4px 9px;border-radius:12px;background:rgba(233,237,227,.09);flex-shrink:0\">✓ queued<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.canQueue }}\" hint-placeholder-val=\"{{ true }}\">\n                <button data-id=\"{{ p.id }}\" onclick=\"{{ queueTrack }}\" title=\"Download this track\" style=\"width:26px;height:26px;border-radius:50%;border:1px solid #272c25;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#99a091;flex-shrink:0;transition:border-color .15s,color .15s\" style-hover=\"border-color:#e9ede3;color:#e9ede3\">\n                  <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4v11M6 10l6 6 6-6M5 20h14\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#111411;border:1px solid #22261f;border-radius:18px;paddi pointer\">\n              <option value=\"all\">All<\u002Foption>\n              <option value=\"done\">Done<\u002Foption>\n              <option value=\"failed\">Failed<\u002Foption>\n              <option value=\"downloading\">Downloading<\u002Foption>\n              <option value=\"queued\">Queued<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div style=\"max-height:430px;overflow-y:auto\">\n            <sc-for list=\"{{ historyRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div data-id=\"{{ r.id }}\" onclick=\"{{ openDetail }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 17px;border-top:1px solid #1a1e19;cursor:pointer;transition:background .12s\" style-hover=\"background:#181c17\">\n                <span title=\"{{ r.statusLabel }}\" style=\"width:6px;height:6px;border-radius:50%;background:{{ r.statusColor }};flex-shrink:0;{{ r.statusPulse }}\"><\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 12.5px 'Instrument Sans';overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.query }}<\u002Fdiv>\n                  <div style=\"font:400 10px 'JetBrains Mono';color:#5d6456;margin-top:2px\">{{ r.quality }} · {{ r.size }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:500 10px 'JetBrains Mono';color:{{ r.wonColor }};flex-shrink:0\">{{ r.won }}<\u002Fspan>\n                <span style=\"font:400 10px 'JetBrains Mono';color:#5d6456;flex-shrink:0;width:52px;text-align:right\">{{ r.when }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ historyEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:32px 16px;text-align:center;color:#5d6456;font:400 13px 'Instrument Sans'\">No requests match.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc- ';color:#5d6456\">{{ ln.active }}<\u002Fspan>\n          <span style=\"font:800 13px 'Doto';color:{{ ln.nameColor }}\">{{ ln.speed }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ bulkBatches }}\" as=\"b\" hint-placeholder-count=\"1\">\n      <section style=\"background:#111411;border:1px solid #22261f;border-radius:20px;margin-bottom:14px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:15px 18px 13px\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n              <span style=\"font:600 14px 'Instrument Sans'\">{{ b.name }}<\u002Fspan>\n              <span style=\"font:600 8.5px 'JetBrains Mono';letter-spacing:.1em;padding:2px 8px;border-radius:10px;border:1px solid #272c25;color:#99a091\">{{ b.originLabel }}<\u002Fspan>\n              <span style=\"font:400 10.5px 'JetBrains Mono';color:#5d6456\">{{ b.owner }}<\u002Fspan>\n              <span style=\"margin-left:auto;font:500 10.5px 'JetBrains Mono';color:#99a091\">{{ b.eta }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-top:9px\">\n              <div style=\"flex:1;height:4px;background:#272c25;border-radius:4px;overflow:hidden\"><div style=\"height:100%;width:{{ b.pctW }};background:#e9ede3;border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"font:400 10.5px 'JetBrains Mono';color:#99a091;flex-shrink:0\">{{ b.counts }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-shrink:0\">\n            <sc-if value=\"{{ b.active }}\" hint-placeholder-val=\"{{ true }}\">\n              <button data-id=\"{{ b.id }}\" onclick=\"{{ pauseBatch }}\" style=\"background:#181c17;border:1px solid #272c25;border-radius:12px;color:#99a091;font:600 10.5px 'JetBrains Mono';padding:7px 13px;cursor:pointer;transition:border-color .15s,color .15s\" style-hover=\"border-color:#39402f;color:#e9ede3\">{{ b.pauseLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <button data-id=\"{{ b.id }}\" onclick=\"{{ cancelBatch }}\" style=\"background:none;border:1px solid #272c25;border-radius:12px;color:#5d6456;font:600 10.5px 'JetBrains Mono';padding:7px 13px;cursor:pointer;transition:border-color .15s,color .15s\" style-hover=\"border-color:rgba(255,76,56,.5);color:#ff6b58\">{{ b.cancelLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ b.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:11px;padding:8px 18px;border-top:1px solid #1a1e19\">\n            <span style=\"width:14px;display:flex;justify-content:center;flex-shrink:0\">\n              <sc-if value=\"{{ r.spin }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:11px;height:11px;border:1.5px solid #272c25;border-top-color:#e9ede3;border-radius:50%;animation:spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.queuedDot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:11px;height:11px;border:1.5px dashed #5d6456;border-radius:50%\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.isDone }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 11px 'JetBrains Mono';color:#99a091\">✓<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.isFailed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 11px 'JetBrains Mono';color:#ff4c38\">✗<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.pausedGlyph }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 10px 'JetBrains Mono';color:#5d6456\">‖<\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"flex:1;min-width:0;font:500 12.5px 'Instrument Sans';overflow:hidden;text-overflow:ellipsis;white-space:no d:#111411;border:1px solid #22261f;border-radius:20px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:15px 18px 12px\">\n          <span style=\"font:600 14px 'Instrument Sans'\">Individual requests<\u002Fspan>\n          <span style=\"font:400 10.5px 'JetBrains Mono';color:#5d6456\">search · explo · cli · listening<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ bulkSingles }}\" as=\"r\" hint-placeholder-count=\"1\">\n          <div data-id=\"{{ r.id }}\" onclick=\"{{ openDetail }}\" style=\"display:flex;align-items:center;gap:11px;padding:9px 18px;border-top:1px solid #1a1e19;cursor:pointer;transition:background .12s\" style-hover=\"background:#181c17\">\n            <span style=\"width:14px;display:flex;justify-content:center;flex-shrink:0\">\n              <sc-if value=\"{{ r.spin }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:11px;height:11px;border:1.5px solid #272c25;border-top-color:#e9ede3;border-radius:50%;animation:spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.queuedDot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:11px;height:11px;border:1.5px dashed #5d6456;border-radius:50%\"><\u002Fspan><\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"flex:1;min-width:0;font:500 12.5px 'Instrument Sans';overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.query }}<\u002Fspan>\n            <span style=\"font:500 10px 'JetBrains Mono';color:#99a091;padding:2px 8px;background:#181c17;border-radius:10px;flex-shrink:0\">via {{ r.via }}<\u002Fspan>\n            <sc-if value=\"{{ r.srcShow }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font:500 10px 'JetBrains Mono';color:#e9ede3;flex-shrink:0\">{{ r.source }}<\u002Fspan><\u002Fsc-if>\n            <span style=\"width:74px;text-align:right;font:400 10px 'JetBrains Mono';color:#99a091;flex-shrink:0\">{{ r.speed }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ bulkEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#111411;border:1px dashed #272c25;border-radius:20px;padding:48px 20px;text-align:center\">\n        <div style=\"font:600 14px 'Instrument Sans';color:#99a091\">Nothing downloading<\u002Fdiv>\n        <div style=\"font:400 12px 'Instrument Sans';color:#5d6456;margin-top:6px\">Search a track, grab from Listening, or paste a Spotify / YouTube playlist link to queue in bulk.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ HISTORY DETAIL DRAWER ============ -->\n  <div onclick=\"{{ closeDetail }}\" style=\"position:fixed;inset:0;background:rgba(5,7,5,.6);z-index:50;transition:opacity .28s;opacity:{{ drawerScrimOpacity }};pointer-events:{{ drawerScrimPE }}\"><\u002Fdiv>\n  <aside style=\"position:fixed;top:0;right:0;bottom:0;width:min(470px,94vw);background:#111411;border-left:1px solid #22261f;z-index:51;transform:{{ drawerTransform }};transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-24px 0 60px rgba(0,0,0,.55);display:flex;flex-direction:column\">\n    <sc-if value=\"{{ detail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px 22px;border-bottom:1px solid #1d211c\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <div style=\"min-width:0\">\n            <div style=\"font:600 17px 'Instrument Sans';letter-spacing:-.01em;line-height:1.25\">{{ detail.query }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin-top:9px\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;background:{{ detail.statusBg }};font:600 10.5px 'JetBrains Mono';letter-spacing:.04em;color:{{ detail.statusColor }}\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ detail.statusColor }}\"><\u002Fspan>{{ detail.statusLabel }}<\u002Fspan>\n              <span style=\"font:500 10.5px 'JetBrains Mono';color:#99a091;padding:2px 9px;background:#181c17;border-radius:10px\">{{ detail.via }}<\u002Fspan>\n              <span style=\"font:400 10.5px 'JetBrains Mono';color:#5d6456\">{{ detail.when }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeDetail }}\" style=\"background:#181c17;border:1px solid #272c25;border-radius:10px;color:#99a091;cursor:pointer;padding:6px 9px;flex-shrink:0;display:inline-flex;transition:color .15s\" style-hover=\"color:#e9ede3\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"transition:transform .35s cubic-bezier(.3,.8,.3,1)\" style-hover=\"transform:rotate(90deg)\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:20px 22px\">\n        <div style=\"font:600 9.5px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#5d6456;margin-bottom:12px\">Cascade trail<\u002Fdiv>\n        <div style=\"position:relative\">\n          <sc-for list=\"{{ detail.attempts }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:12px;padding-bottom:16px;position:relative\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;flex-shrink:0\">\n                <span style=\"width:24px;height:24px;border-radius:50%;background:{{ a.iconBg }};border:1px solid {{ a.iconColor }};display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono';color:{{ a.iconColor }};z-index:1\">{{ a.icon }}<\u002Fspan>\n                <sc-if value=\"{{ a.connector }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:1px;flex:1;background:#272c25;margin-top:2px;min-height:14px\"> etBrains Mono';color:{{ panel.tierColor }};margin-top:7px\">{{ panel.tierLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closePanel }}\" style=\"background:#181c17;border:1px solid #272c25;border-radius:10px;color:#99a091;cursor:pointer;padding:6px 9px;display:inline-flex;transition:color .15s\" style-hover=\"color:#e9ede3\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"transition:transform .35s cubic-bezier(.3,.8,.3,1)\" style-hover=\"transform:rotate(90deg)\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:20px 22px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;background:#0c0e0c;border:1px solid #272c25;border-radius:14px;padding:13px 15px;margin-bottom:20px\">\n          <div>\n            <div style=\"font:600 13px 'Instrument Sans'\">Enabled<\u002Fdiv>\n            <div style=\"font:400 10.5px 'JetBrains Mono';color:#5d6456;margin-top:3px\">{{ panel.enabledSub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ togglePanelEnabled }}\" disabled=\"{{ panel.pinned }}\" style=\"width:42px;height:24px;border-radius:14px;border:none;cursor:{{ panel.toggleCursor }};background:{{ panel.toggleBg }};position:relative;transition:background .2s;flex-shrink:0\"><span style=\"position:absolute;top:2px;left:{{ panel.knobLeft }};width:20px;height:20px;border-radius:50%;background:{{ panel.knobBg }};transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)\"><\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ panel.note }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#0c0e0c;border:1px solid #272c25;border-radius:14px;padding:13px 15px;font:400 11.5px 'JetBrains Mono';color:#99a091;line-height:1.55;margin-bottom:20px\">{{ panel.note }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ panel.hasSettings }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:600 9.5px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#5d6456;margin-bottom:11px\">Settings<\u002Fdiv>\n          <sc-for list=\"{{ panel.settings }}\" as=\"s\" hint-placeholder-count=\"1\">\n            <div style=\"margin-bottom:16px\">\n              <label style=\"display:block;font:500 12px 'JetBrains Mono';color:#e9ede3;margin-bottom:6px\">{{ s.label }}<\u002Flabel>\n              <input value=\"{{ s.value }}\" data-key=\"{{ s.key }}\" oninput=\"{{ onPanelField }}\" type=\"{{ s.type }}\" style=\"width:100%;background:#0c0e0c;border:1px solid #272c25;border-radius:12px;color:#e9ede3;font:500 13px 'JetBrains Mono';padding:10px 13px\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ panel.hasCreds }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:600 9.5px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#5d6456;margin:4px 0 11px;display:flex;align-items:center;gap:8px\">Credentials <span style=\"font-weight:400;text-transform:none;letter-spacing:0;color:#464d40\">· encrypted at rest, never displayed<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ panel.creds }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:15px\">\n              <label style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n                <span style=\"font:500 12px 'JetBrains Mono';color:#e9ede3\">{{ c.label }}<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;gap:5px;font:500 10px 'JetBrains Mono';color:{{ c.statusColor }}\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ c.statusColor }}\"><\u002Fspan>{{ c.statusText }}<\u002Fspan>\n              <\u002Flabel>\n              <input value=\"{{ c.value }}\" data-key=\"{{ c.key }}\" oninput=\"{{ onPanelField }}\" type=\"password\" placeholder=\"{{ c.placeholder }}\" style=\"width:100%;background:#0c0e0c;border:1px solid #272c25;border-radius:12px;color:#e9ede3;font:500 13px 'JetBrains Mono';padding:10px 13px\">\n              <div style=\"font:400 10px 'JetBrains Mono';color:#464d40;margin-top:5px\">{{ c.env }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:16px 22px;border-top:1px solid #1d211c;display:flex;align-items:center;gap:12px\">\n        <button onclick=\"{{ savePanel }}\" disabled=\"{{ panel.saveDisabled }}\" style=\"flex:1;background:{{ panel.saveBtnBg }};border:none;border-radius:14px;color:{{ panel.saveBtnColor }};font:600 13px 'Instrument Sans';padding:12px;cursor:{{ panel.saveCursor }};transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px\">\n          <sc-if value=\"{{ panel.saving }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:12px;height:12px;border:1.5px solid rgba(12,14,12,.3);border-top-color:#0c0e0c;border-radius:50%;animation:spin .8s linear infinite\"><\u002Fspan><\u002Fsc-if>\n          {{ panel.saveBtnText }}\n        <\u002Fbutton>\n        <sc-if value=\"{{ panel.canValidate }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ validatePanel }}\" style=\"background:#181c17;border:1px solid #272c25;border-radius:14px;color:#e9ede3;font:600 13px 'Instrument Sans';padding:12px 16px;cursor:pointer;transition:border-color .15s\" style-hover=\"border-color:#39402f\">Test<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Faside>\n\n  <!-- ============ BULK DOWNLOADS PANEL ============ -->\n  <div onclick=\"{{ closeBulkPanel }}\" style=\"position:fixed;inset:0;background:rgba(5,7,5,.6);z-index:54;transition:opacity .28s;opacity:{{ bpScrimOpacity }};pointer-events:{{ bpScrimPE }}\"><\u002Fdiv>\n  <aside data-screen-label=\"Bulk panel\" style=\"position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:#111411;border-left:1px solid #22261f;z-index:55;transform:{{ bpTransform }};transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:-24px 0 60px rgba(0,0,0,.55);display:flex;flex-direction:column\">\n    <div style=\"padding:20px 22px;border-bottom:1px solid #1d211c;display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n      <div>\n        <div style=\"font:600 17px 'Instrument Sans';letter-spacing:-.01em\">Bulk downloads<\u002Fdiv>\n        <div style=\"font:500 10.5px 'JetBrains Mono';color:#99a091;margin-top:7px\">{{ bpSummary }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ closeBulkPanel }}\" style=\"background:#181c17;border:1px solid #272c25;border-radius:10px;color:#99a091;cursor:pointer;padding:6px 9px;flex-shrink:0;display:inline-flex;transition:color .15s\" style-hover=\"color:#e9ede3\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"transition:transform .35s cubic-bezier(.3,.8,.3,1)\" style-hover=\"transform:rotate(90deg)\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;padding:18px 22px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px\">\n        <div style=\"background:#dfe4d6;border-radius:14px;padding:12px 14px\">\n          <div style=\"font:600 9px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:#4d5346\">Combined speed<\u002Fdiv>\n          <div style=\"font:800 24px 'Doto';color:#14170f;margin-top:6px\">{{ bpSpeed }} <span style=\"font-size:12px\">MB/s<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0c0e0c;border:1px solid #272c25;border-radius:14px;padding:12px 14px\">\n          <div s t dl=b.tracks.filter(t=>t.status==='downloading').length;\n      const done=b.tracks.filter(t=>t.status==='done').length;\n      const failed=b.tracks.filter(t=>t.status==='failed').length;\n      const complete=done+failed===b.total;\n      const expanded=!!s.expandedBatches[b.id];\n      let visible;\n      if(expanded) visible=b.tracks;\n      else if(complete) visible=b.tracks.filter(t=>t.status==='failed').concat(b.tracks.filter(t=>t.status==='done').slice(-3));\n      else visible=b.tracks.filter(t=>t.status==='downloading'||t.status==='failed').concat(b.tracks.filter(t=>t.status==='queued').slice(0,3));\n      const hidden=b.total-visible.length;\n      const rows=visible.map(t=>{\n        const dling=t.status==='downloading';\n        return {\n          bid:b.id, tid:t.id,\n          title:t.artist+' — '+t.title,\n          titleColor:t.status==='done'?'#5d6456':'#e9ede3',\n          spin:dling&&!b.paused, pausedGlyph:dling&&b.paused,\n          queuedDot:t.status==='queued',\n          isDone:t.status==='done', isFailed:t.status==='failed',\n          source:t.source, tierLabel:'T'+t.tier, tierColor:this.tierColor(t.tier),\n          barW:Math.round(t.progress)+'%',\n          barColor:t.status==='failed'?'#ff4c38':'#e9ede3',\n          pct:t.status==='done'?'100%':(t.status==='queued'?'':(Math.round(t.progress)+'%')),\n          speed:(dling&&!b.paused&&t._sp)?(t._sp.toFixed(1)+' MB/s'):(t.status==='queued'?'queued':(t.status==='done'?'done':(t.status==='failed'?'failed':'paused'))),\n          speedColor:t.status==='failed'?'#ff4c38':(t.status==='done'?'#5d6456':'#99a091'),\n        };\n      });\n      const remaining=b.total-done-failed;\n      const etaS=Math.ceil(remaining*6/Math.max(1,conc));\n      return {\n        id:b.id, name:b.name, originLabel:b.origin.toUpperCase(), owner:b.owner,\n        counts:done+' / '+b.total+' done'+(dl?(' · '+dl+' downloading'):'')+(failed?(' · '+failed+' failed'):''),\n        pctW:Math.round(done/b.total*100)+'%',\n        eta: b.paused?'paused':(complete?(failed?('done · '+failed+' failed'):'complete'):(etaS>=90?('≈ '+Math.round(etaS/60)+'m left'):('≈ '+etaS+'s left'))),\n        active:!complete, complete,\n        pauseLabel:b.paused?'resume':'pause',\n        cancelLabel:complete?'dismiss':'cancel',\n        rows,\n        showFooter:hidden>0||expanded,\n        footerLabel:expanded?'collapse ▴':('show all '+b.total+' tracks ▾'),\n      };\n    });\n    const bulkSingles=inflightReq.map(r=>({\n      id:r.id, query:r.query, via:r.via,\n      spin:r.status==='downloading', queuedDot:r.status==='queued',\n      source:r._src||'', srcShow:!!r._src,\n      speed:r._sp?(r._sp.toFixed(1)+' MB/s'):'queued',\n    }));\n    const bulkEmpty=this.BATCHES.length===0&&bulkSingles.length===0;\n    const pageBulk=s.page==='bulk', pageConsole=!pageBulk;\n    const bpOpen=s.bulkPanel;\n\n    return {\n      pageConsole, pageBulk,\n      gotoConsole:()=>this.setState({page:'console'}),\n      gotoBulk:()=>this.setState({page:'bulk', bulkPanel:false}),\n      navConsoleBg:pageConsole?'#e9ede3':'transparent', navConsoleColor:pageConsole?'#14170f':'#99a091',\n      navBulkBg:pageBulk?'#e9ede3':'transparent', navBulkColor:pageBulk?'#14170f':'#99a091',\n      activeBadge:totalActive>0, activeCount:String(totalActive),\n      searchHasPlaylists: s.searchState==='results' && s.searchPls.length>0,\n      searchPlaylists: s.searchPls.map(pl=>{\n        const nm=((pl.name||'').replace(/[^a-z0-9]/gi,'').toUpperCase()+'CRATE');\n        return {id:pl.id, name:pl.name, originLabel:pl.origin.toUpperCase(),\n          sub:pl.tracks+' tracks · '+pl.owner+(pl.resolved?' · resolved from link':''),\n          g1:nm[0],g2:nm[1],g3:nm[2],g4:nm[3],\n          queued:!!s.queuedPls[pl.id], canQueue:!s.queuedPls[pl.id],\n          queuedLabel:'✓ '+pl.tracks+' queued', queueLabel:'Queue all '+pl.tracks};\n      }),\n      queuePlaylist:(e)=>{\n        e.preventDefault();\n        const id=e.currentTarget.dataset.id;\n        const pl=this.PLAYLISTS.concat([this.LINKPL.spotify,this.LINKPL.youtube]).find(p=>p.id===id);\n        if(!pl||s.queuedPls[id]) return;\n        this.startBatch(pl);\n        clearTimeout(this._toastT);\n        this.setState(st=>({queuedPls:Object.assign({},st.queuedPls,{[id]:true}), bulkPanel:true, toast:'Queued playlist: '+pl.name+' ('+pl.tracks+' tracks)', toastKind:'ok'}));\n        this._toastT=setTimeout(()=>this.setState({toast:null}),2600);\n      },\n      bulkStats, sourceLanes, bulkBatches, bulkSingles,\n      bulkHasSingles:bulkSingles.length>0, bulkEmpty,\n      toggleBatch:(e)=>{ const id=e.currentTarget.dataset.id; this.setState(st=>({expandedBatches:Object.assign({},st.expandedBatches,{[id]:!st.expandedBatches[id]})})); },\n      pauseBatch:(e)=>{ const b=this.BATCHES.find(x=>x.id===e.currentTarget.dataset.id); if(b){ b.paused=!b.paused; this.forceUpdate(); } },\n      cancelBatch:(e)=>{\n        const id=e.currentTarget.dataset.id;\n        const b=this.BATCHES.find(x=>x.id===id);\n        this.BATCHES=this.BATCHES.filter(x=>x.id!==id);\n        if(b){ delete this._batchFor[b.plId]; }\n        clearTimeout(this._toastT);\n        this.setState(st=>{\n          const q=Object.assign({},st.queuedPls); if(b) delete q[b.plId];\n          return {queuedPls:q, toast:b?((b.complete?'Dismissed: ':'Cancelled: ')+b.name):null, toastKind:'ok'};\n        });\n        this._toastT=setTimeout(()=>this.setState({toast:null}),2600);\n      },\n      retryTrack:(e)=>{\n        const d=e.currentTarget.dataset;\n        const b=this.BATCHES.find(x=>x.id===d.bid); if(!b) return;\n        const t=b.tracks.find(x=>x.id===d.tid);\n        if(t){ t.status='queued'; t.willFail=false; t.progress=0; this.forceUpdate(); }\n      },\n      openBulkPanel:()=>this.setState({bulkPanel:true}),\n      closeBulkPanel:()=>this.setState({bulkPanel:false}),\n      bpTransform:bpOpen?'translateX(0)':'translateX(103%)',\n      bpScrimOpacity:bpOpen?'1':'0', bpScrimPE:bpOpen?'auto':'none',\n      bpSummary:totalActive+' active · '+(qCount+singlesQ)+' queued · all sources',\n      bpSpeed:speedSum?speedSum.toFixed(1):'0.0',\n      bpEmpty:this.BATCHES.length===0,\n      bpSinglesLine: bulkSingles.length?(bulkSingles.length+' individual request'+(bulkSingles.length>1?'s':'')+' in flight'):null,\n\n      npId:np.id, npTitle:np.title, npArtist:np.artist,\n      npProgress: Math.round(npEl/npDur*100)+'%',\n      npTime: this.fmtDur(npEl)+' / '+this.fmtDur(npDur),\n      npQueued, npCanQueue:!npQueued,\n      recentPlays,\n\n      searchVisible, searchQ:s.searchQ, searchOpen,\n      searchLoading: s.searchState==='loading',\n      searchEmpty: s.searchState==='empty',\n      searchHasResults: s.searchState==='results' && searchResults.length>0,\n      searchResults,\n      onSearchInput:(e)=>{\n        const q=e.target.value;\n        this.setState({searchQ:q, searchFocus:true});\n        clearTimeout(this._searchT);\n        this._searchT=setTimeout(()=>this.runSearch(q), 220);\n      },\n      onSearchFocus:()=>{ clearTimeout(this._blurT); this.setState({searchFocus:true}); },\n      onSearchBlur:()=>{ this._blurT=setTimeout(()=>this.setState({searchFocus:false}), 180); },\n      queueTrack:(e)=>{\n        e.preventDefault();\n        const t=this.CATALOG.find(x=>x.id===e.currentTarget.dataset.id);\n        if(t) this.queueDownload(t);\n      },\n\n      connLabel, connDotColor,\n      statCards, winsByTier,\n      inflight, liveEmpty, liveSummary,\n      histSearch:s.histSearch, histStatus:s.histStatus,\n      onSearch:(e)=>this.setState({histSearch:e.target.value}),\n      onStatus:(e)=>this.setState({histStatus:e.target.value}),\n      historyRows, historyEmpty,\n      openDetail:(e)=>{\n        const id=e.currentTarget.dataset.id;\n        const req=this.REQUESTS.find(x=>x.id===id);\n        this.setState({selectedId:id, showLogs: !!req && req.status==='failed'});\n      },\n      closeDetail:()=>this.setState({selectedId:null}),\n      detail,\n      showLogs:s.showLogs,\n      logsChevron:s.showLogs?'hide ▴':'show ▾',\n      toggleLogs:()=>this.setState(st=>({showLogs:!st.showLogs})),\n      drawerTransform:drawerOpen?'translateX(0)':'translateX(103%)',\n      drawerScrimOpacity:drawerOpen?'1':'0', drawerScrimPE:drawerOpen?'auto':'none',\n\n      tiers,\n      trayItems, trayEmpty:trayList.length===0&&!trayOver,\n      trayCount: trayList.length===0?'empty':(trayList.length+(trayList.length===1?' source':' sources')),\n      trayBorder: trayOver?'#99a091':'#22261f', trayBg: trayOver?'rgba(233,237,227,.03)':'#0e100d',\n      saveText:sv.text, saveColor:sv.color, saveBg:sv.bg, saveBorder:sv.border, saveSpinning:sv.spin,\n      setStrategy:(e)=>{\n        const key=e.currentTarget.dataset.tier; const strat=e.currentTarget.dataset.strategy;\n        const cfg=JSON.parse(JSON.stringify(s.config));\n        const t=cfg.tiers.find(t=>String(t.tier)===String(key));\n        if(t && t.strategy!==strat){ t.strategy=strat; this.setState({config:cfg}); this.autosave(); }\n      },\n      onCardDragStart:(e)=>{\n        const name=e.currentTarget.dataset.source;\n        if(name==='ytdlp'){ e.preventDefault(); this.reject(name); return; }\n        e.dataTransfer.effectAllowed='move';\n        try{ e.dataTransfer.setData('text/plain',name); }catch(_){}\n        this.setState({dragSource:name});\n      },\n      onCardDragEnd:()=>this.clearDrag(),\n      onCardDragOver:(e)=>{\n        if(!s.dragSource) return;\n        e.preventDefault(); e.stopPropagation();\n        const t=e.currentTarget.dataset; const idx=Number(t.index);\n        const rect=e.currentTarget.getBoundingClientRect();\n        const after=(e.clientX-rect.left)>rect.width/2;\n        this.setState({dragOverTier:t.tier, dragOverIndex: after?idx+1:idx});\n      },\n      onColDragOver:(e)=>{\n        if(!s.dragSource) return;\n        e.preventDefault();\n        const key=e.currentTarget.dataset.tier;\n        if(String(s.dragOverTier)!==String(key)){\n          const col=(key==='disabled')?s.config.disabled:(s.config.tiers.find(t=>String(t.tier)===String(key))||{sources:[]}).sources;\n          this.setState({dragOverTier:key, dragOverIndex:col.length});\n        }\n      },\n      onColDrop:(e)=>{\n        e.preventDefault();\n        const key=e.currentTarget.dataset.tier; const name=s.dragSource;\n        if(!name){ this.clearDrag(); return; }\n        if(name==='ytdlp'){ this.reject(name); this.clearDrag(); return; }\n        this.moveSource(name, key, s.dragOverIndex);\n        this.clearDrag();\n      },\n\n      openPanel:(e)=>{ e.stopPropagation(); this.setState({panelSource:e.currentTarget.dataset.source, panelValues:{}, panelSave:'idle'}); },\n      closePanel:()=>this.setState({panelSource:null}),\n      onPanelField:(e)=>{\n        const key=e.currentTarget.dataset.key; const val=e.target.value;\n        this.setState(st=>({panelValues:Object.assign({},st.panelValues,{[key]:val}), panelSave:'dirty'}));\n      },\n      togglePanelEnabled:()=>{\n        const name=s.panelSource; if(name==='ytdlp') return;\n        const cfg=JSON.parse(JSON.stringify(s.config));\n        const disabled=cfg.disabled.includes(name);\n        if(disabled){ cfg.disabled=cfg.disabled.filter(x=>x!==name); cfg.tiers.find(t=>t.tier===2).sources.push(name); }\n        else { cfg.tiers.forEach(t=>t.sources=t.sources.filter(x=>x!==name)); cfg.disabled.push(name); }\n        this.setState({config:cfg}); this.autosave();\n      },\n      savePanel:()=>{\n        clearTimeout(this._panelT);\n        this.setState({panelSave:'saving'});\n        this._panelT=setTimeout(()=>{\n          this.setState({panelSave:'saved', toast:'Credentials saved — encrypted at rest', toastKind:'ok'});\n          clearTimeout(this._toastT); this._toastT=setTimeout(()=>this.setState({toast:null}),2600);\n        },800);\n      },\n      validatePanel:()=>{\n        this.setState({toast:'Testing '+s.panelSource+' credentials…', toastKind:'ok'});\n        clearTimeout(this._toastT);\n        this._toastT=setTimeout(()=>this.setState({toast:s.panelSource+' credentials valid ✓', toastKind:'ok'}),1100);\n      },\n      panel,\n      panelTransform:panelOpen?'translateX(0)':'translateX(103%)',\n      panelScrimOpacity:panelOpen?'1':'0', panelScrimPE:panelOpen?'auto':'none',\n\n      toast:s.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
