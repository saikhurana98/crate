name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: validate Docker Compose
        run: |
          cp .crate.env.example .crate.env
          docker compose config --quiet
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest

  console-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - name: dependency audit
        run: npm audit --audit-level=high
      - name: typecheck + build
        run: npm run build
