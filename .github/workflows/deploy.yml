name: deploy

# Deploys to the self-hosted runners on the music-stack hosts. Runs after a
# green release (image published to GHCR) or on demand. Pulls the released
# image, recreates the LIVE console + serve containers, health-checks the
# console, and rolls back to the previous image if it does not come up.
#
# Hosts (one runner label each, same stack layout on both):
#   music-stack      — personal host
#   lab-music-stack  — Ashoka lab CT (navidrome + music-assistant + crate)
on:
  workflow_dispatch:
    inputs:
      target:
        description: which host to deploy to
        type: choice
        default: all
        options: [all, music-stack, lab-music-stack]
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # the LIVE stack — crate-console (:8788) + crate-serve run from here, NOT
  # /opt/crate/docker-compose.yml (an orphan single-service file).
  STACK: /opt/music-stack/docker-compose.yml
  SERVICES: crate-console crate-serve
  HEALTH_URL: http://127.0.0.1:8788/api/health

jobs:
  plan:
    # only after a green release on main, or a manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - id: pick
        run: |
          target="${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}"
          if [ "$target" = "all" ]; then
            echo 'runners=["music-stack","lab-music-stack"]' >> "$GITHUB_OUTPUT"
          else
            echo "runners=[\"$target\"]" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Snapshot current image (for rollback)
        id: prev
        run: |
          cid=$(docker compose -f "$STACK" ps -q crate-console 2>/dev/null || true)
          img=$(docker inspect "$cid" --format '{{.Image}}' 2>/dev/null || true)
          echo "img=${img:-none}" >> "$GITHUB_OUTPUT"
          echo "previous console image: ${img:-none}"

      - name: Pull released image
        run: docker compose -f "$STACK" pull $SERVICES

      - name: Recreate services
        # --force-recreate: the :latest tag is stable, so compose must be told to
        # replace the running containers even though the tag string is unchanged.
        # --no-deps: leave navidrome / music-assistant / explo alone.
        run: docker compose -f "$STACK" up -d --force-recreate --no-deps $SERVICES

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "console healthy after ${i} attempt(s)"; exit 0; fi
            echo "waiting for console health (got $code)…"; sleep 3
          done
          echo "::error::console did not return 200 from $HEALTH_URL after ~120s"
          docker compose -f "$STACK" logs --tail=80 $SERVICES || true
          exit 1

      - name: Monochrome search smoke test
        run: |
          docker compose -f "$STACK" exec -T crate-console python - <<'PY'
          from crate.composition.sources import build_candidate_sources

          sources = build_candidate_sources()
          if "monochrome" not in sources:
              raise SystemExit("Monochrome manual search is unavailable")
          results = sources["monochrome"][0]("Zara Sa", None)
          if not any(row.title.casefold() == "zara sa" for row in results):
              raise SystemExit("Monochrome live search returned no Zara Sa match")
          print(f"Monochrome live search healthy: {len(results)} candidate(s)")
          PY

      - name: Configured Antra worker smoke test
        run: |
          docker compose -f "$STACK" exec -T crate-serve python - <<'PY'
          from crate.composition.catalog import default_layout, reconcile_layout
          from crate.composition.sources import build_candidate_sources, build_config_store

          config = build_config_store()
          stored = config.get_layout()
          layout = reconcile_layout(stored) if stored else default_layout()
          enabled = {name for tier in layout["tiers"] for name in tier["sources"]}
          if "antra" not in enabled:
              print("Antra disabled on this host; worker smoke test skipped")
          else:
              sources = build_candidate_sources()
              if "antra" not in sources:
                  raise SystemExit(
                      "Antra is enabled but the worker could not load its credentials/provider"
                  )
              print("Antra worker provider healthy: stored credentials loaded")
          PY

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.img != 'none'
        run: |
          echo "::warning::deploy failed — rolling back to ${{ steps.prev.outputs.img }}"
          docker tag "${{ steps.prev.outputs.img }}" ghcr.io/${{ github.repository_owner }}/crate:latest
          docker compose -f "$STACK" up -d --force-recreate --no-deps $SERVICES

      - name: Prune dangling images
        if: success()
        run: docker image prune -f

      - name: Logout
        if: always()
        run: docker logout ghcr.io
