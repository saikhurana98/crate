x-crate-common: &crate-common
  image: ghcr.io/saikhurana98/crate:latest
  build: .
  env_file:
    - .crate.env
  environment:
    CRATE_DB: /data/crate.db
    CRATE_SERVE_DOWNLOADS: /downloads/staging
    CRATE_LIBRARY_ROOT: /downloads/library
  volumes:
    - ./data:/data
    - ./downloads:/downloads
    # Point this bind mount at the same host directory slskd uses when enabling
    # Soulseek; Crate needs write access because it moves completed files out.
    - ./slskd-downloads:/slskd-downloads
  restart: unless-stopped

services:
  crate-console:
    <<: *crate-common
    command: ["console", "--host", "0.0.0.0", "--port", "8788"]
    ports:
      # Local-only by default. Use an authenticated reverse proxy before
      # exposing the console to a LAN or the internet.
      - "127.0.0.1:8788:8788"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  crate-serve:
    <<: *crate-common
    command: ["serve", "--host", "0.0.0.0", "--port", "2416"]
    ports:
      - "127.0.0.1:2416:2416"
    depends_on:
      crate-console:
        condition: service_healthy

  crate-cli:
    <<: *crate-common
    profiles: ["cli"]
    restart: "no"
    command: ["--help"]
