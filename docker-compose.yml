# crate is a CLI, so use `docker compose run`, not `up`:
#   docker compose run --rm crate download "Daft Punk Get Lucky" -o /downloads
#
# Put your creds in a .env file next to this (see keys below). Only the sources
# you configure are enabled; each is opt-in.

services:
  crate:
    image: ghcr.io/saikhurana98/crate:latest
    build: .
    environment:
      # Tier 1 — Qobuz (hi-res FLAC)
      CRATE_QOBUZ: "1"
      CRATE_QOBUZ_APP_ID: ${CRATE_QOBUZ_APP_ID:-}
      CRATE_QOBUZ_APP_SECRET: ${CRATE_QOBUZ_APP_SECRET:-}
      CRATE_QOBUZ_TOKEN: ${CRATE_QOBUZ_TOKEN:-}
      # Tier 1 — Antra hosted lossless resolver
      CRATE_ANTRA: ${CRATE_ANTRA:-}
      CRATE_ANTRA_BASE: ${CRATE_ANTRA_BASE:-https://antra.hoshi.cfd}
      CRATE_ANTRA_USERNAME: ${CRATE_ANTRA_USERNAME:-}
      CRATE_ANTRA_PASSWORD: ${CRATE_ANTRA_PASSWORD:-}
      # Tier 2 — Deezer (16-bit FLAC)
      CRATE_DEEZER: ${CRATE_DEEZER:-}
      CRATE_DEEZER_ARL: ${CRATE_DEEZER_ARL:-}
      # Tier 2 — Soulseek (needs a reachable slskd + its downloads dir mounted)
      CRATE_SOULSEEK: ${CRATE_SOULSEEK:-}
      CRATE_SLSKD_URL: ${CRATE_SLSKD_URL:-}
      CRATE_SLSKD_API_KEY: ${CRATE_SLSKD_API_KEY:-}
      CRATE_SLSKD_DOWNLOADS: /slskd-downloads
      # multiplex strategy per tier: all | uniform
      CRATE_MUX_TIER2: ${CRATE_MUX_TIER2:-all}
    volumes:
      - ./downloads:/downloads
      # - /path/to/slskd/downloads:/slskd-downloads:ro   # if using Soulseek
