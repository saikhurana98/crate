[project]
name = "lbmd"
version = "0.1.0"
description = "Load-balanced music downloader — tiered FLAC acquisition CLI, Explo-compatible"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.15",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pycryptodome>=3.23.0",
]

[project.scripts]
lbmd = "lbmd.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "playwright>=1.61.0",
  "telethon>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbmd"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "PL", "RUF"]

[tool.ruff.lint.pylint]
# Source adapters inject several collaborators (http, decrypt, clock, jwt) for
# testability; allow the wider keyword-only signature.
max-args = 9

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Enforce hexagonal layering: domain/ports must not reach outward. The ban is
# global; per-file-ignores below lift it for the layers allowed to wire concretes.
"lbmd.adapters".msg = "domain/ports must not import adapters (hexagonal layering)"
"lbmd.infrastructure".msg = "domain/ports must not import infrastructure (hexagonal layering)"

[tool.ruff.lint.per-file-ignores]
# Only domain/ + ports/ are forbidden from importing outward. Application wires
# concretes today (ports/composition refactor is deferred, ADR-0017).
"src/lbmd/application/**" = ["TID251"]
"src/lbmd/adapters/**" = ["TID251"]
"src/lbmd/infrastructure/**" = ["TID251"]
"src/lbmd/composition/**" = ["TID251", "PLC0415"]
"src/lbmd/cli/**" = ["TID251", "PLC0415"]
# browser layer embeds JS strings (E501), checks HTTP status codes (PLR2004),
# and lazy-imports playwright (PLC0415) to keep it an optional dependency.
"src/lbmd/infrastructure/browser/**" = ["E501", "PLR2004", "PLC0415"]
# telegram client lazy-imports telethon (optional dep) inside methods
"src/lbmd/infrastructure/telegram/**" = ["PLC0415"]
"tests/**" = ["TID251", "PLR2004", "E501", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["lbmd"]

[[tool.mypy.overrides]]
module = ["telethon.*", "Crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=lbmd --cov-report=term-missing --cov-fail-under=90 --strict-markers"

[tool.coverage.run]
branch = true
source = ["src/lbmd"]
